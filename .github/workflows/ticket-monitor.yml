name: Hajduk ticket monitor

on:
  schedule:
    # Every 15 min on off-peak minutes (:07 :22 :37 :52). Top-of-hour slots are the
    # most congested on GitHub and the most likely to be delayed or dropped.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write            # commit seen.json back after an alert

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Consecutive-failure counter survives between runs via the Actions cache
      # (restores the newest "monitor-state-*" entry, saves a fresh one each run).
      - name: Restore failure counter
        uses: actions/cache/restore@v4
        with:
          path: .failures
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Check for tickets
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_tickets.py

      - name: Save failure counter
        if: always() && hashFiles('.failures') != ''
        uses: actions/cache/save@v4
        with:
          path: .failures
          key: monitor-state-${{ github.run_id }}

      - name: Persist seen events
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "ticket-bot"
            git config user.email "ticket-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "Record alerted event"
            git pull --rebase
            git push
          fi